# AI Assistant Configuration

# AI Provider Settings
ai:
  default_provider: "deepseek"
  default_model: "deepseek-chat"
  # default_model format: provider/model (e.g., deepseek/deepseek-chat)
  max_tokens: 4096
  temperature: 0.7

  providers:
    openai:
      api_key: ""
      model: "gpt-4o"
      base_url: null
    deepseek:
      api_key: "sk-fcf3dd57ce814bfe9070d2ff1294a1b3"
      model: "deepseek-chat"
    siliconflow:
      api_key: ""
      model: "deepseek-ai/DeepSeek-V3"
    anthropic:
      api_key: ""
      model: "claude-sonnet-4-20250514"
    gemini:
      api_key: ""
      model: "gemini-2.0-flash"
    groq:
      api_key: ""
      model: "llama-3.3-70b-versatile"
    ollama:
      base_url: "http://localhost:11434"
      model: "llama3.1"
    custom:
      base_url: ""
      api_key: ""
      model: ""

# Chat Reader Settings
chat_reader:
  wechat:
    enabled: false
    poll_interval: 5
    auto_summary: true
    summary_batch_size: 20
    summary_interval: 300
  qq:
    enabled: false
    napcat_url: "http://127.0.0.1:3000"
    poll_interval: 5
    auto_summary: true

# Search Settings
search:
  provider: "duckduckgo"
  max_results: 5
  content_extraction: true

# UI Settings
ui:
  theme: "dark"
  language: "zh"
  floating_ball:
    enabled: true
    size: 48
    opacity: 0.85
    always_on_top: true
  main_window:
    width: 900
    height: 650

# Storage
storage:
  db_path: "data/assistant.db"
  backup_enabled: false

# Backup
backup:
  enabled: true
  directory: "data/backups"
  auto_on_startup: true
  interval_hours: 24
  max_backups: 10
